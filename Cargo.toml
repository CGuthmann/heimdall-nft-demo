[package]
name = "heimdall-nft-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = {version = "0.11.24", features = ["blocking", "json"]}
heimdall = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
crypto = {git = "https://github.com/CGuthmann/heimdall-rs.git", branch = "feature/rapid_witnesscalc"}
nft = {git = "ssh://git@gitlab.cc-asp.fraunhofer.de/blockchainlab/sfnfts.git", branch = "feature/rapid_witnesscalc"}
heimdall-nft ={ git="ssh://git@gitlab.cc-asp.fraunhofer.de/blockchainlab/heimdall-nft.git", branch = "dev" }
heimdall-nft-server ={ path="./heimdall-nft-server"}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.9"
num-bigint = { version = "0.4",features = ["serde", "rand"]}
num-traits = {version = "0.2.11"}